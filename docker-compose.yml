# Production stack (default) — Postgres + API + web (nginx). No MailHog.
#
# Used by Coolify and local prod smoke tests: docker compose up -d --build
#
# Set env in Coolify (or root `.env` locally). The web container serves the SPA
# and reverse-proxies API routes to the api service. Leave VITE_API_URL empty
# so the browser uses same-origin requests through nginx.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cw_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_watcher}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://${POSTGRES_USER:-cw_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crypto_watcher}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_URL: ${WEB_URL:?Set WEB_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      RPC_URL: ${RPC_URL:-https://sepolia.base.org}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    expose:
      - '3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SITE_URL: ${VITE_SITE_URL:?Set VITE_SITE_URL}
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
        VITE_DEFAULT_CHAIN_ID: ${VITE_DEFAULT_CHAIN_ID:-84532}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-80}:80'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
