services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crypto_watcher
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter api run dev
    environment:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crypto_watcher
      LOG_LEVEL: debug
      SMTP_HOST: mailhog
      SMTP_PORT: '1025'
      RPC_URL: ${RPC_URL:-https://sepolia.base.org}
      CORS_ORIGINS: http://localhost:5173
      # tsx/chokidar file watching inside the container (HMR).
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter web run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
      VITE_DEFAULT_CHAIN_ID: '84532'
      # Vite HMR file watching inside the container.
      VITE_USE_POLLING: 'true'
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
    depends_on:
      - api

volumes:
  pgdata:
