# Production stack (default) — Postgres + API + web (nginx). No MailHog.
#
# Used by Coolify and local prod smoke tests: docker compose up -d --build
#
# web is not bound to host :80 (Coolify's proxy uses it). In Coolify, point your
# domain at the web service on container port 80. Do not add a networks: block —
# a custom network isolates this stack and Coolify's proxy cannot reach it.
# Local smoke test without Coolify:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Set env in Coolify (or root `.env` locally). The web container serves the SPA
# and reverse-proxies /api/* to the api service. Leave VITE_API_URL empty so the
# client uses /api in production (SPA routes like /auth/* stay on the web app).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cw_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_watcher}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://${POSTGRES_USER:-cw_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crypto_watcher}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_URL: ${WEB_URL:?Set WEB_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      RPC_URL: ${RPC_URL:-https://sepolia.base.org}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SITE_URL: ${VITE_SITE_URL:?Set VITE_SITE_URL}
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
        VITE_DEFAULT_CHAIN_ID: ${VITE_DEFAULT_CHAIN_ID:-84532}
    restart: unless-stopped
    expose:
      - '80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
