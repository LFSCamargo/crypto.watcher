[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
# Allow the deploy script to record deployed addresses under deployments/.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

# Named RPC endpoints. SEPOLIA_RPC_URL is used by the fork-based integration
# tests (test/integration) and skips when unset. BASE_SEPOLIA_RPC_URL is the
# deploy target (see .env.example and script/deploy-base-sepolia.sh).
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# Contract verification on Base Sepolia (Basescan). Set BASESCAN_API_KEY to verify.
[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api", chain = 84532 }
