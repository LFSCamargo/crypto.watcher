name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  monorepo:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:spaghetti
      - run: pnpm --filter o1-check run build
      - run: pnpm run o1-check:api
      - run: pnpm run o1-check:web
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts --no-commit
      - run: forge build --sizes
      - run: forge test -vvv
