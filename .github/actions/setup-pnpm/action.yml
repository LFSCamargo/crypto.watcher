name: Setup Node and pnpm
description: Install pnpm, Node 22.13, and workspace dependencies (run after checkout).
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.13
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
