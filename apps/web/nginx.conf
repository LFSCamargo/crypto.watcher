server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # API-only endpoints (never SPA).
    location = /health {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for browser navigations on paths shared with the API.
    # (rewrite+break in the same block as proxy_pass still hits the API — use @spa.)
    location @spa {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Paths shared by the SPA and the API (mirrors vite.config.ts apiProxy bypass).
    # Browser navigations (Accept: text/html) → SPA; fetch/XHR → API.
    location ~ ^/(auth|market|projects|analysis-requests|users|reputation|governance|docs) {
        error_page 418 = @spa;
        if ($http_accept ~* text/html) {
            return 418;
        }
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
